map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mypopvault.online 54.145.50.157;

    # Certbot ACME challenge directory for Let's Encrypt SSL certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP traffic to HTTPS for api.mypopvault.online
    location / {
        return 301 https://api.mypopvault.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.mypopvault.online;

    # Docker internal DNS resolver to prevent static IP caching 502 errors
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.mypopvault.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mypopvault.online/privkey.pem;

    # SSL Optimizations & Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API endpoints reverse proxy to backend container (port 5000)
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        set $backend_target http://backend:5000;
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Socket.IO WebSocket proxying (handles /socket.io and /socket.io/)
    location /socket.io {
        set $socket_target http://backend:5000;
        proxy_pass $socket_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
